@if (auth.estaLogueado()) {
  <nav class="social-nav" aria-label="Navegación principal">
    <div class="social-nav__shell">
      <a class="social-brand" routerLink="/publicaciones" aria-label="Red-Social, inicio">
        <span class="social-brand__mark">
          <img src="red-social-icon.png" alt="">
        </span>
        <span class="social-brand__name">Red<span>Social</span></span>
      </a>

      <div class="social-nav__links">
        <a class="social-nav__link" routerLink="/publicaciones" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: true }">
          <span class="icon-tile"><i class="bi bi-grid-1x2-fill"></i></span>
          <span>Inicio</span>
        </a>
        <a class="social-nav__link" routerLink="/mi-perfil" routerLinkActive="is-active">
          <span class="icon-tile"><i class="bi bi-person-fill"></i></span>
          <span>Mi perfil</span>
        </a>
        <a class="social-nav__link" *appSoloAdmin routerLink="/dashboard/usuarios"
           routerLinkActive="is-active">
          <span class="icon-tile"><i class="bi bi-people-fill"></i></span>
          <span>Usuarios</span>
        </a>
        <a class="social-nav__link" *appSoloAdmin routerLink="/dashboard/estadisticas"
           routerLinkActive="is-active">
          <span class="icon-tile"><i class="bi bi-bar-chart-fill"></i></span>
          <span>Estadísticas</span>
        </a>
      </div>

      @if (auth.usuarioActual(); as usuario) {
        <div class="social-nav__account">
          <a class="account-chip" routerLink="/mi-perfil" aria-label="Abrir mi perfil">
            @if (usuario.imagenPerfil) {
              <img class="account-chip__avatar" [src]="usuario.imagenPerfil | urlImagen" alt="">
            } @else {
              <span class="account-chip__avatar account-chip__fallback">
                {{ usuario.nombre.charAt(0) }}{{ usuario.apellido.charAt(0) }}
              </span>
            }
            <span class="account-chip__copy">
              <strong>{{ usuario.nombre }}</strong>
              <small>&#64;{{ usuario.usuario }}</small>
            </span>
          </a>
          <button type="button" class="icon-tile logout-tile" (click)="cerrarSesion()"
                  aria-label="Cerrar sesión" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      }
    </div>
  </nav>
}
